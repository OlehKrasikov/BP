version: '3.8'

services:
  backend:
    build: ./backend
    restart: unless-stopped
    container_name: segmentation-api
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    container_name: segmentation-ui
   # ports:
   #  - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
  
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
networks:
  app-network:
    driver: bridge
